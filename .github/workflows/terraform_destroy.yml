name: "Destroy Infrastructure"
run-name: "Destroy Infrastructure in ${{ github.event.inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod

jobs:
  terraform:
    name: "destroy-terraform-${{ github.event.inputs.environment }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TFVARS: ${{ secrets.TFVARS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: |
          echo -e $TFVARS > terraform/terraform.tfvars
          terraform -chdir=terraform init -backend-config="resource_group_name=${{ secrets.RESOURCE_GROUP_NAME }}" -backend-config="storage_account_name=${{ secrets.STORAGE_ACCOUNT_NAME }}" -backend-config="container_name=tfstate" -backend-config="key=listen-${{ secrets.TF_STATE_FILE }}-${{ github.event.inputs.environment }}.tfstate"
      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -destroy -input=false -var="environment=${{ github.event.inputs.environment }}"

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -destroy -input=false -auto-approve -var="environment=${{ github.event.inputs.environment }}"

