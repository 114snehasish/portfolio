<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" version="1.1" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a192f"/>

  <!-- Circuit board pattern -->
  <g stroke="#8892b0" stroke-width="1.5" opacity="0.3">
    <!-- Horizontal lines -->
    <path d="M 50,50 H 350"/>
    <path d="M 100,100 H 300"/>
    <path d="M 75,150 H 325"/>
    <path d="M 125,200 H 275"/>
    <path d="M 50,250 H 350"/>

    <!-- Vertical connections -->
    <path d="M 100,50 V 100"/>
    <path d="M 200,100 V 150"/>
    <path d="M 300,150 V 200"/>
    <path d="M 150,200 V 250"/>

    <!-- Circuit nodes -->
    <circle cx="100" cy="50" r="4" fill="#ccd6f6"/>
    <circle cx="200" cy="100" r="4" fill="#ccd6f6"/>
    <circle cx="300" cy="150" r="4" fill="#ccd6f6"/>
    <circle cx="150" cy="200" r="4" fill="#ccd6f6"/>
  </g>

  <!-- Central component with programming symbols -->
  <g transform="translate(200,150)">
    <rect x="-80" y="-40" width="160" height="80" fill="none" stroke="#37e784" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="#37e784" opacity="0.2"/>

    <!-- Programming symbols inside the rectangle -->
    <g fill="#ccd6f6">
      <text x="-60" y="10" font-family="monospace" font-size="24">{}</text>
      <text x="-10" y="10" font-family="monospace" font-size="24">&lt;/&gt;</text>
      <text x="40" y="10" font-family="monospace" font-size="24">()</text>
    </g>
  </g>
</svg>

